[project]
name = "inksetter"
version = "0.2.1"
description = "OPDS proxy that renders manga/comic pages for E-Ink screens"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.0",
    "httpx>=0.28",
    "numpy>=2.3",
    "scipy>=1.14",
    "fastapi>=0.116",
    "pyvips[binary]>=3.0",
    "uvicorn[standard]>=0.35",
    "rapidocr-onnxruntime>=1.4",
    "opencv-python-headless>=4.5.1.48",
]

[tool.uv]
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "ruff>=0.16.5"
]
build = [
    "pyinstaller>=6.22.3 ; sys_platform == 'win32'"
]